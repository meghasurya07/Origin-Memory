[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origin-brain"
version = "0.4.0"
description = "Human-Like Brain/Memory Infrastructure for AI Agents — by Origin AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Origin AI", email = "info@originai.in" }
]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.0"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0"
]
all = [
    "origin-brain[test,server]"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
